# reins model assignment (design §5) — the user changes it with `reins config`; nothing reads it while you work
schema: reins/bindings@2
mode: multi
audit:
  required: true
default:
  vendor: claude
  model: claude-opus-5-5
tools:
  claude:
    cli: claude
    use: true
  openai:
    cli: codex
    use: true
  google:
    cli: agy
    use: true
  gemini:
    cli: gemini
    use: false
  copilot:
    cli: copilot
    use: true
  cursor:
    cli: cursor-agent
    use: true
