schema: reins/gates@1
gates:
  typecheck:
    cmd: pnpm typecheck
    from: package.json#scripts.typecheck
  lint:
    cmd: pnpm lint
    from: package.json#scripts.lint
  format:
    cmd: pnpm exec oxfmt --check
    from: .github/workflows/ci.yml#Format check (oxfmt)
